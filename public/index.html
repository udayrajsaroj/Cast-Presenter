<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Display</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root { --verse-base-scale: 1.0; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10;
    }
    #pdfCanvas, #slideImage, #castVideo {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      display: none;
    }
    #castVideo {
      width: 100vw;
      height: 100vh;
    }
    #placeholder {
      display: none;
      width: 90vw;
      max-width: 1200px;
      text-align: center;
      padding: 48px;
    }
    #waiting {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(20px, 3vw, 36px);
      opacity: 0.75;
      text-align: center;
      padding: 24px;
      z-index: 5;
    }

    /* --- FIX: Cast Iframe --- */
    #castIframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 50;
      display: none;
      background: #fff;
    }

    /* --- FIX: Video Autoplay Overlay --- */
    #videoOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.3s;
    }
    #videoOverlay:hover { background: rgba(0, 0, 0, 0.8); }
    #videoOverlayIcon { font-size: 60px; color: #fff; margin-bottom: 15px; }
    #videoOverlayText { font-size: 24px; font-weight: bold; color: #fff; text-align: center; padding: 0 20px; }

    /* --- Bilingual Verse Stage --- */
    #verseStage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 20;
      display: none;
      flex-direction: column;
    }
    #verseBg {
      position: absolute;
      inset: 0;
      background-color: #1a1a2e;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }
    #verseOverlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }
    #verseContent {
      position: relative;
      z-index: 2;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 4vh 6vw;
      text-align: center;
      justify-content: center;
      color: #fff;
    }

    .verse-section {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1vh 2vw;
      word-break: break-word;
      white-space: pre-wrap;
    }

    #verseRefSection {
      flex: 0 0 auto;
      margin-bottom: 3vh;
      font-family: sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffeb3b;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    #verseRef {
      font-size: calc(2.5vh * var(--verse-base-scale));
    }

    #verseHiSection {
      font-family: 'Noto Sans Devanagari', 'Mangal', sans-serif;
      font-weight: 500;
      color: #e0f2f1;
      margin-bottom: 2vh;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    #verseHiText {
      font-size: calc(4vh * var(--verse-base-scale));
      line-height: 1.5;
    }

    #verseDivider {
      width: 80px;
      height: 2px;
      background: rgba(255,255,255,0.3);
      margin: 1.5vh auto;
    }

    #verseEnSection {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-style: italic;
      color: #f8fafc;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    #verseEnText {
      font-size: calc(3.8vh * var(--verse-base-scale));
      line-height: 1.4;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="waiting">Waiting for connection…</div>
  
  <!-- FIX: Added Overlay for Autoplay Permission -->
  <div id="videoOverlay">
    <div id="videoOverlayIcon">▶</div>
    <div id="videoOverlayText">Tap anywhere to enable Remote Control</div>
  </div>

  <!-- FIX: Added Cast Iframe -->
  <iframe id="castIframe" allowfullscreen allow="autoplay"></iframe>

  <div id="stage">
    <canvas id="pdfCanvas"></canvas>
    <img id="slideImage" alt="" />
    <video id="castVideo" playsinline controls></video>
    <div id="placeholder">
      <h1 id="slideNumber"></h1>
      <p id="slideText"></p>
    </div>
  </div>

  <div id="verseStage">
    <div id="verseBg"></div>
    <div id="verseOverlay"></div>
    <div id="verseContent">
      <div id="verseRefSection" class="verse-section">
        <span id="verseRef"></span>
      </div>
      <div id="verseHiSection" class="verse-section">
        <div id="verseHiText"></div>
      </div>
      <div id="verseDivider"></div>
      <div id="verseEnSection" class="verse-section">
        <div id="verseEnText"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

    const waitingEl      = document.getElementById("waiting");
    const stageEl        = document.getElementById("stage");
    const pdfCanvas      = document.getElementById("pdfCanvas");
    const slideImage     = document.getElementById("slideImage");
    const castVideo      = document.getElementById("castVideo");
    const placeholderEl  = document.getElementById("placeholder");
    const slideNumberEl  = document.getElementById("slideNumber");
    const slideTextEl    = document.getElementById("slideText");
    const castIframe     = document.getElementById("castIframe");
    const videoOverlay   = document.getElementById("videoOverlay"); // FIX

    const verseStage     = document.getElementById("verseStage");
    const verseBg        = document.getElementById("verseBg");
    const verseDivider   = document.getElementById("verseDivider");
    const verseRef       = document.getElementById("verseRef");
    const verseEnText    = document.getElementById("verseEnText");
    const verseEnSection = document.getElementById("verseEnSection");
    const verseHiText    = document.getElementById("verseHiText");
    const verseHiSection = document.getElementById("verseHiSection");

    let pdfDoc      = null;
    let renderTask  = null;
    let displayMode = "waiting";
    let videoInteracted = false; // FIX: Track if user clicked on TV

    const state = {
      type: null,
      totalPages: 0,
      currentPage: 1,
      slideImages: [],
      documentUrl: null,
    };

    const socket = io({ transports: ["websocket", "polling"], reconnection: true });

    socket.on("change-font-size", (payload) => {
      if (payload && payload.scale) {
        document.documentElement.style.setProperty("--verse-base-scale", payload.scale);
      }
    });

    function resolveUrl(url) {
      if (!url) return "";
      if (/^https?:\/\//i.test(url)) return url;
      if (url.startsWith("/")) return `${window.location.origin}${url}`;
      return `${window.location.origin}/${url}`;
    }

    function hideAll() {
      pdfCanvas.style.display     = "none";
      slideImage.style.display    = "none";
      placeholderEl.style.display = "none";
      castVideo.style.display     = "none";
      castIframe.style.display    = "none";
      videoOverlay.style.display  = "none"; // FIX: Hide overlay
      try { castVideo.pause(); } catch (_e) {}
    }

    // FIX: Overlay click handler to grant autoplay permission
    videoOverlay.addEventListener("click", () => {
      castVideo.play().then(() => {
        videoInteracted = true;
        videoOverlay.style.display = "none";
      }).catch(err => {
        console.error("Play failed even after click", err);
      });
    });

    function showVerseView(payload) {
      displayMode = "verse";
      waitingEl.style.display = "none";
      stageEl.style.display   = "none";
      hideAll();

      const hiTxt = (payload.hiText || "").replace(/\s+/g, " ").trim();
      const enTxt = (payload.enText || "").replace(/\s+/g, " ").trim();

      const bgUrl = resolveUrl(payload.backgroundUrl || "/backgrounds/nature-1.jpg");
      verseBg.style.cssText = `
        position: absolute;
        inset: 0;
        background: #1a1a2e url("${bgUrl.replace(/"/g, '%22')}") center center / cover no-repeat;
      `;

      verseRef.textContent    = payload.reference || "";
      verseHiText.textContent = hiTxt;
      verseEnText.textContent = enTxt;

      verseHiSection.style.display = hiTxt ? "flex" : "none";
      verseDivider.style.display   = hiTxt ? "block" : "none";
      verseEnSection.style.display = enTxt ? "flex" : "none";

      verseStage.style.display = "flex";
    }

    function hideVerseView() {
      verseStage.style.display = "none";
      verseBg.style.cssText = `
        position: absolute;
        inset: 0;
        background-color: #1a1a2e;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
      `;
      if (displayMode === "verse") displayMode = "document";
      stageEl.style.display = "flex";
    }

    async function renderPdfPage(pageNumber) {
      const page = await pdfDoc.getPage(pageNumber);
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(
        window.innerWidth  / base.width,
        window.innerHeight / base.height
      ) * window.devicePixelRatio;
      const viewport = page.getViewport({ scale });

      pdfCanvas.width  = viewport.width;
      pdfCanvas.height = viewport.height;
      pdfCanvas.style.width  = `${viewport.width  / window.devicePixelRatio}px`;
      pdfCanvas.style.height = `${viewport.height / window.devicePixelRatio}px`;

      const ctx = pdfCanvas.getContext("2d");
      if (renderTask) { try { renderTask.cancel(); } catch (_e) {} }
      renderTask = page.render({ canvasContext: ctx, viewport });
      await renderTask.promise;

      hideAll();
      pdfCanvas.style.display = "block";
    }

    async function loadPdf(url) {
      pdfDoc = await pdfjsLib.getDocument(url).promise;
    }

    function renderPptxSlide(pageNumber) {
      const slide = state.slideImages[pageNumber - 1];
      hideAll();
      waitingEl.style.display = "none";
      if (!slide) {
        placeholderEl.style.display = "block";
        slideNumberEl.textContent   = `Slide ${pageNumber}`;
        slideTextEl.textContent     = "";
        return;
      }
      if (slide.images && slide.images.length > 0) {
        slideImage.src = slide.images[0];
        slideImage.style.display = "block";
        return;
      }
      placeholderEl.style.display = "block";
      slideNumberEl.textContent   = `Slide ${slide.index || pageNumber}`;
      slideTextEl.textContent     = slide.placeholder || "";
    }

    // FIX: Updated renderVideo with Autoplay handling
    function renderVideo() {
      hideAll();
      waitingEl.style.display = "none";
      const base = resolveUrl(state.documentUrl || "/api/document/file");
      castVideo.src = `${base}${base.includes("?") ? "&" : "?"}t=${Date.now()}`;
      castVideo.style.display = "block";
      
      videoInteracted = false; // Reset interaction state

      const playPromise = castVideo.play();
      if (playPromise !== undefined) {
        playPromise.then(_ => {
          // Autoplay started successfully
          videoInteracted = true;
        })
        .catch(error => {
          console.log("[TV] Autoplay blocked. Showing overlay.");
          // Autoplay prevented, show overlay so user must click
          videoOverlay.style.display = "flex";
        });
      }
    }

    async function renderCurrent() {
      if (displayMode === "verse" || displayMode === "url") return;
      if (!state.type || state.totalPages < 1) {
        hideAll();
        waitingEl.style.display = "flex";
        waitingEl.textContent   = "Waiting for document…";
        stageEl.style.display   = "flex";
        return;
      }
      waitingEl.style.display = "none";
      stageEl.style.display   = "flex";

      if (state.type === "pdf") {
        if (!pdfDoc && state.documentUrl) {
          await loadPdf(`${state.documentUrl}?t=${Date.now()}`);
        }
        await renderPdfPage(state.currentPage);
        return;
      }
      if (state.type === "pptx") { renderPptxSlide(state.currentPage); return; }
      if (state.type === "video") renderVideo();
    }

    async function applyPayload(payload, reloadPdf) {
      castIframe.style.display = "none";
      castIframe.src = "";
      
      hideVerseView();
      displayMode = "document";

      state.type        = payload.type;
      state.totalPages  = payload.totalPages  || 0;
      state.currentPage = payload.currentPage || payload.page || 1;
      state.slideImages = payload.slideImages || [];

      if (payload.documentUrl) {
        state.documentUrl = payload.documentUrl.startsWith("http")
          ? payload.documentUrl
          : resolveUrl(payload.documentUrl);
      }

      if (reloadPdf) pdfDoc = null;
      if (state.type === "pdf" && state.documentUrl && reloadPdf) {
        await loadPdf(`${state.documentUrl}?t=${Date.now()}`);
      }

      await renderCurrent();
    }

    socket.on("connect", () => {
      socket.emit("join-room", { role: "viewer" }, async (ack) => {
        if (!ack) return;
        await applyPayload(ack, true);
      });
    });

    socket.on("upload-document", (payload) => {
      applyPayload(payload, true).catch(() => {});
    });

    socket.on("change-page", (payload) => {
      applyPayload(payload, false).catch(() => {});
    });

    socket.on("show-verse", (payload) => {
      showVerseView(payload);
    });

    socket.on("video-control", (payload) => {
      if (state.type !== "video") return;
      
      // If user hasn't interacted yet, force overlay up
      if (!videoInteracted && payload.action === "play") {
        videoOverlay.style.display = "flex";
        return;
      }

      if (payload.action === "play")  castVideo.play().catch(() => {});
      if (payload.action === "pause") castVideo.pause();
      if (typeof payload.time === "number") castVideo.currentTime = payload.time;
    });

    socket.on("video-seek", (payload) => {
      if (state.type !== "video") return;
      if (typeof payload.delta === "number") {
        castVideo.currentTime += payload.delta;
      }
    });

    socket.on("open-url", (payload) => {
      let targetUrl = payload.url;
      
      // Hide everything else
      hideAll();
      hideVerseView();
      stageEl.style.display = "none"; 
      verseStage.style.display = "none";
      waitingEl.style.display = "none";

      // Check if it's the "Back to App" command
      if (targetUrl.includes(window.location.origin) || targetUrl === "/") {
          castIframe.style.display = "none";
          displayMode = "document";
          renderCurrent().catch(() => {});
      } else {
          // --- FIX: YouTube Embed Conversion ---
          if (targetUrl.includes("youtube.com") || targetUrl.includes("youtu.be")) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = targetUrl.match(regExp);
            if (match && match[2].length === 11) {
              targetUrl = `https://www.youtube.com/embed/${match[2]}?autoplay=1`;
              console.log("[TV] Converted YouTube URL to Embed:", targetUrl);
            }
          }
          // ------------------------------------

          castIframe.src = targetUrl;
          castIframe.style.display = "block";
          displayMode = "url";
      }
    });

    socket.on("disconnect", () => {
      hideVerseView();
      castIframe.style.display = "none";
      waitingEl.style.display = "flex";
      waitingEl.textContent   = "Reconnecting…";
    });

    window.addEventListener("resize", () => {
      if (displayMode === "verse" || displayMode === "url") return;
      renderCurrent().catch(() => {});
    });
  </script>
</body>
</html>
